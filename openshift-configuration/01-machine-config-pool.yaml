apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: gpu
spec:
  machineConfigSelector:
    matchExpressions:
      - {key: machineconfiguration.openshift.io/role, operator: In, values: [gpu,worker]}
  nodeSelector:
    matchLabels:
      nvidia.com/gpu.present: 'true'