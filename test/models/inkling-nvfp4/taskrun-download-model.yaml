apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: download-inkling-nvfp4
  namespace: experiment-01
spec:
  taskRef:
    resolver: cluster
    params:
      - name: kind
        value: task
      - name: name
        value: download-model
      - name: namespace
        value: pipelines
  params:
    - name: MODEL_NAME
      value: "RedHatAI/Inkling-nvfp4"
    - name: MODEL_REVISION
      value: "main"
    - name: SKIP_IF_EXISTS
      value: "false"
    - name: CACHE_DIR
      value: "models"
  podTemplate:
    tolerations:
      - effect: NoSchedule
        key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Exists
  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: model-storage-lso
