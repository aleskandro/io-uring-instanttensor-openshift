apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  name: download-deepseek-v4-flash-0731-1
  namespace: experiment-01
  labels:
    app.kubernetes.io/component: model-download
    model: deepseek-v4-flash-0731
spec:
  taskRef:
    resolver: cluster
    params:
      - name: kind
        value: task
      - name: name
        value: download-model
      - name: namespace
        value: pipelines
  params:
    - name: MODEL_NAME
      value: "deepseek-ai/DeepSeek-V4-Flash-0731"
    - name: MODEL_REVISION
      value: "main"
    - name: SKIP_IF_EXISTS
      value: "false"
    - name: CACHE_DIR
      value: "models"
  podTemplate:
    tolerations:
      - effect: NoSchedule
        key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Exists

  workspaces:
    - name: models-storage
      persistentVolumeClaim:
        claimName: model-storage-lso
