apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/enable-prometheus-scraping: "true"
  name: llm-inference-service
  namespace: experiment-02
spec:
  model:
    name: Qwen/Qwen3-32B
    uri: pvc://model-storage-lso
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    tolerations:
      - effect: NoSchedule
        key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Exists
    containers:
      - args:
          - --port=8000
          - --host=0.0.0.0
          - --model=/mnt/models/models--Qwen--Qwen3-32B/
          - --served-model-name=Qwen/Qwen3-32B
          - --tensor-parallel-size=2
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --gpu-memory-utilization=0.95
          #- --trust-remote-code
          #- --no-enable-log-requests
          #- --enable-prefix-caching
          #- --max-model-len=40960
          - --disable-uvicorn-access-log
        image: quay.io/willsparker/vllm-cuda-rhel9-instanttensor
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 400
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: main
        resources:
          limits:
            nvidia.com/gpu: "2"
          requests:
            nvidia.com/gpu: "2"