apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  annotations:
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/enable-prometheus-scraping: "true"
  name: llm-inference-service
  namespace: experiment-01
spec:
  model:
    name: RedHatAI/gemma-4-26B-A4B-it
    uri: pvc://model-storage-lso
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    tolerations:
      - effect: NoSchedule
        key: benchmark.llm-d.ai/test-gpu-amd64
        operator: Exists
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/io-uring.json
    initContainers:
      - name: uring-smoke-test
        image: quay.io/aleskandrox/asd:vllm
        imagePullPolicy: Always
        command:
          - /usr/local/bin/uring-test
    containers:
      - args:
         - --port=8000
         - --host=0.0.0.0
         - --model=/mnt/models/models--RedHatAI--gemma-4-26B-A4B-it/
         - --served-model-name=RedHatAI/gemma-4-26B-A4B-it
         - --tensor-parallel-size=1
         - --enable-ssl-refresh
         - --ssl-certfile=/var/run/kserve/tls/tls.crt
         - --ssl-keyfile=/var/run/kserve/tls/tls.key
         - --gpu-memory-utilization=0.95
         - --load-format=instanttensor
        #- --trust-remote-code
        #- --no-enable-log-requests
        #- --enable-prefix-caching
        #- --max-model-len=40960
         - --disable-uvicorn-access-log
        image: quay.io/aleskandrox/asd:vllm
        env:
          - name: INSTANTTENSOR_DEBUG
            value: '1'
          - name: INSTANTTENSOR_BACKEND
            value: URING
        command:
         - python3
         - -m
         - vllm.entrypoints.openai.api_server
        securityContext:
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/io-uring.json
          capabilities:
            add:
              - IPC_LOCK
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 400
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: main
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
